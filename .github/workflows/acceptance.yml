name: acceptance

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg for m4b marker fixture
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Syntax + unit tests
        run: |
          node --check docs/app.js
          node --check docs/drive.js
          node --check docs/immune-cards.js
          node --check docs/sleep.js
          node --check docs/sw.js
          node --test

  playwright-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium + WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Acceptance (Jeff Drive fixture; Chromium desktop, WebKit iPhone 390, Chromium iPhone-UA 390; old shell upgrade)
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
