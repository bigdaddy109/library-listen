<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee4" />
    <meta
      name="description"
      content="Library Listen — rice-paper bookshelf. Sign in with Google to play from the shared Library folder."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="書架" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg?v=37" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=37" />
    <link rel="stylesheet" href="./styles.css?v=37" />
    <link rel="stylesheet" href="./shelf/shelf.css?v=37" />
    <title>書架 · Library Listen</title>
  </head>
  <body class="shell-shelf" data-shell="shelf">
    <div id="app" class="paper">
      <header class="mast">
        <p class="eyebrow">Library Listen</p>
        <div class="mast-row">
          <h1>書架</h1>
          <div class="mast-links">
            <button type="button" id="btn-change" class="ghost hidden" title="Change library source">
              Change source
            </button>
            <a class="player-link" href="./classic/index.html">舊版播放器</a>
          </div>
        </div>
        <p class="lede">
          紙色書架。用 Google 登入讀共享的 <code>Library</code> 資料夾，或改用本機檔案。
        </p>
        <section id="onboarding" class="onboarding">
          <div class="load-row cta-stack">
            <button type="button" id="btn-google" class="primary large" title="Sign in with Google">
              用 Google 登入
            </button>
            <button type="button" id="btn-pick-main" class="text-link">
              Use a local folder instead
            </button>
            <button type="button" id="btn-pick-files" class="ghost hidden" hidden>
              Choose audio files
            </button>
          </div>
          <p class="hint" id="drive-status" role="status" aria-live="polite"></p>
          <p class="hint" id="capability-hint"></p>
          <p
            id="library-status"
            class="library-status hidden"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </section>
        <p id="load-hint" class="hint">尚未選庫時顯示示範書。登入或選資料夾後即可聽／讀。</p>
      </header>

      <div class="toolbar">
        <div class="search" role="search">
          <label class="visually-hidden" for="shelf-query">搜尋書名、作者或章節</label>
          <input
            id="shelf-query"
            type="search"
            placeholder="搜尋書名、作者、章節"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            enterkeyhint="search"
          />
          <button type="button" id="btn-clear-search" class="search-clear hidden" aria-label="清除搜尋">
            ×
          </button>
        </div>
        <div class="view-toggle" role="tablist" aria-label="檢視">
          <button type="button" data-view="spines" aria-pressed="true">書架</button>
          <button type="button" data-view="topics" aria-pressed="false">主題卡片</button>
          <button type="button" data-view="covers" aria-pressed="false">封面牆</button>
        </div>
      </div>

      <div id="series-chips" class="chips" aria-label="系列"></div>
      <p id="shelf-count" class="count"></p>
      <div id="shelf-banners" class="shelf-banners"></div>
      <main id="stage" class="stage" aria-live="polite"></main>
    </div>

    <section id="book" class="book-screen hidden">
      <button type="button" id="btn-back" class="ghost back">← 書架</button>
      <div class="book-hero">
        <div id="book-cover" class="cover large"></div>
        <div class="book-meta">
          <p class="collection" id="book-collection"></p>
          <h2 id="book-title"></h2>
          <p class="author" id="book-author"></p>
          <p class="subtitle" id="book-subtitle"></p>
        </div>
      </div>
      <div class="offline-row">
        <button type="button" id="btn-offline" class="ghost">Save to this device</button>
        <p class="hint" id="book-offline-status"></p>
      </div>
      <div id="book-tabs" class="book-tabs hidden">
        <button type="button" id="tab-audio" aria-pressed="true">Audio</button>
        <button type="button" id="tab-read" class="hidden" aria-pressed="false">Read</button>
        <button type="button" id="tab-concepts" aria-pressed="false">Concepts</button>
      </div>
      <ul id="chapter-list" class="chapter-list"></ul>
      <div id="concept-list" class="concept-list hidden"></div>
      <div id="reader" class="reader hidden">
        <div class="reader-bar">
          <button type="button" id="reader-prev" class="ghost" aria-label="Previous section">
            Previous
          </button>
          <p id="reader-label" class="reader-label"></p>
          <button type="button" id="reader-next" class="ghost" aria-label="Next section">
            Next
          </button>
        </div>
        <iframe
          id="reader-frame"
          class="reader-frame"
          title="Ebook"
          sandbox="allow-same-origin"
        ></iframe>
        <p id="reader-status" class="hint"></p>
      </div>
    </section>

    <footer id="player-bar" class="player-bar hidden">
      <div class="player-cover" id="player-cover"></div>
      <div class="player-text">
        <div id="player-title" class="player-title">—</div>
        <div class="player-sub">
          <div id="player-chapter" class="player-chapter">—</div>
          <button type="button" id="btn-rate" class="skip rate" aria-label="Playback speed 1.0×">
            1.0×
          </button>
          <button type="button" id="btn-sleep" class="skip sleep" aria-label="Sleep timer off">
            Sleep
          </button>
        </div>
      </div>
      <div class="player-controls">
        <button type="button" id="btn-prev" class="icon" aria-label="Back to start or previous part">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2.2v12H6V6zm3.2 6 8.8 6.2V5.8L9.2 12z" />
          </svg>
        </button>
        <button
          type="button"
          id="btn-play"
          class="icon play is-paused"
          aria-label="Play"
        >
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5-11-6.5z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
          </svg>
        </button>
        <button type="button" id="btn-next" class="icon" aria-label="Next chapter">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.8 6H18v12h-2.2V6zM6 5.8v12.4L14.8 12 6 5.8z" />
          </svg>
        </button>
      </div>
      <div class="player-time">
        <button type="button" id="btn-back30" class="skip" aria-label="Back 30 seconds">
          −30
        </button>
        <span id="player-pos">0:00</span>
        <input
          id="player-seek"
          type="range"
          min="0"
          max="1000"
          step="1"
          value="0"
          aria-label="Seek"
        />
        <span id="player-dur">0:00</span>
        <button type="button" id="btn-fwd30" class="skip" aria-label="Forward 30 seconds">
          +30
        </button>
      </div>
    </footer>

    <div id="book-layer" class="book-layer hidden" hidden>
      <button type="button" id="btn-close-book" class="close-book" aria-label="放回書架">
        放回
      </button>
      <div id="book-stage" class="book-stage"></div>
    </div>

    <input
      id="file-input-dir"
      type="file"
      webkitdirectory
      directory
      multiple
      hidden
    />
    <input
      id="file-input-files"
      type="file"
      accept="audio/*,image/jpeg,image/png,image/webp,.mp3,.m4a,.m4b,.aac,.epub,.jpg,.jpeg,.png,.webp"
      multiple
      hidden
    />
    <audio id="audio" preload="metadata" playsinline></audio>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="source-sheet" class="sheet hidden" hidden role="dialog" aria-modal="true" aria-labelledby="source-sheet-title">
      <div class="sheet-card">
        <h2 id="source-sheet-title">Library source</h2>
        <p id="source-sheet-copy" class="hint">
          Sign in with Google to load the shared <code>Library</code> folder.
        </p>
        <ul id="source-sheet-list" class="source-list"></ul>
        <div class="cta-row cta-stack">
          <button type="button" id="btn-sheet-reload" class="primary hidden">
            Reload library
          </button>
          <button type="button" id="btn-sheet-google" class="primary hidden">
            用 Google 登入
          </button>
          <button type="button" id="btn-sheet-local-link" class="text-link hidden">
            Use a local folder instead
          </button>
          <button type="button" id="btn-sheet-signout" class="ghost hidden">
            Sign out
          </button>
          <details id="source-sheet-advanced" class="source-advanced hidden" hidden>
            <summary>Advanced</summary>
            <div class="cta-row cta-stack">
              <button type="button" id="btn-sheet-local" class="ghost hidden">
                Choose Library folder
              </button>
              <button type="button" id="btn-sheet-files" class="ghost hidden">
                Choose audio files
              </button>
            </div>
          </details>
          <button type="button" id="btn-sheet-picker" class="ghost hidden" hidden>
            Browse Google Drive
          </button>
          <button type="button" id="btn-sheet-cancel" class="ghost">Cancel</button>
        </div>
      </div>
    </div>
    <button type="button" id="btn-sort" class="hidden" hidden title="Sort shelf">Sort</button>
    <script type="module" src="./app.js?v=37"></script>
  </body>
</html>
