<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee4" />
    <meta
      name="description"
      content="Library Listen — 紙色書架。用 Google 登入，播放共享的 Library 資料夾。"
    />
    <meta property="og:title" content="書架 · Library Listen" />
    <meta property="og:description" content="紙色封面牆。用 Google 登入聽共享的 Library 資料夾，或改用本機檔案。" />
    <meta property="og:image" content="https://bigdaddy109.github.io/library-listen/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bigdaddy109.github.io/library-listen/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="書架" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg?v=51" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=51" />
    <link rel="stylesheet" href="./styles.css?v=51" />
    <link rel="stylesheet" href="./shelf/shelf.css?v=51" />
    <title>書架 · Library Listen</title>
  </head>
  <body class="shell-shelf" data-shell="shelf">
    <div id="app" class="paper">
      <header class="mast">
        <p class="eyebrow">Library Listen <span id="app-version" class="app-version"></span></p>
        <div class="mast-row">
          <h1>書架</h1>
          <div class="mast-links">
            <button type="button" id="btn-change" class="ghost hidden" title="更換書庫來源">
              更換來源
            </button>
            <a class="player-link" href="./classic/index.html">舊版播放器</a>
          </div>
        </div>
        <p class="lede">
          紙色書架。用 Google 登入聽共享的 <code>Library</code> 資料夾，或改用本機檔案。
        </p>
        <section id="onboarding" class="onboarding">
          <div class="load-row cta-stack">
            <button type="button" id="btn-google" class="primary large" title="用 Google 登入">
              用 Google 登入
            </button>
            <button type="button" id="btn-pick-main" class="text-link">
              改用本機資料夾
            </button>
            <button type="button" id="btn-pick-files" class="ghost hidden" hidden>
              選擇音檔
            </button>
          </div>
          <p class="hint" id="drive-status" role="status" aria-live="polite"></p>
          <p class="hint" id="capability-hint"></p>
          <p
            id="library-status"
            class="library-status hidden"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </section>
        <p id="load-hint" class="hint">尚未選庫時顯示示範書。登入或選資料夾後即可聽。</p>
      </header>

      <div class="toolbar">
        <div class="search" role="search">
          <label class="visually-hidden" for="shelf-query">搜尋書名、作者或章節</label>
          <input
            id="shelf-query"
            type="search"
            placeholder="搜尋書名、作者、章節"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            enterkeyhint="search"
          />
          <button type="button" id="btn-clear-search" class="search-clear hidden" aria-label="清除搜尋">
            ×
          </button>
        </div>
        <div class="view-toggle" role="tablist" aria-label="檢視">
          <button type="button" data-view="covers" aria-pressed="true">封面牆</button>
          <button type="button" data-view="spines" aria-pressed="false">書架</button>
        </div>
      </div>

      <div id="series-chips" class="chips" aria-label="系列"></div>
      <p id="shelf-count" class="count"></p>
      <div id="shelf-banners" class="shelf-banners"></div>
      <main id="stage" class="stage" aria-live="polite"></main>
    </div>

    <section id="book" class="book-screen hidden">
      <button type="button" id="btn-back" class="ghost back">← 書架</button>
      <div class="book-hero">
        <div id="book-cover" class="cover large"></div>
        <div class="book-meta">
          <p class="collection" id="book-collection"></p>
          <h2 id="book-title"></h2>
          <p class="author" id="book-author"></p>
          <p class="subtitle" id="book-subtitle"></p>
          <a id="read-this-book" class="read-this-book hidden" hidden>讀這本</a>
        </div>
      </div>
      <div class="offline-row">
        <button type="button" id="btn-offline" class="ghost">存到這台裝置</button>
        <p class="hint" id="book-offline-status"></p>
      </div>
      <div id="book-tabs" class="book-tabs hidden">
        <button type="button" id="tab-audio" aria-pressed="true">音檔</button>
        <button type="button" id="tab-concepts" aria-pressed="false">概念</button>
      </div>
      <ul id="chapter-list" class="chapter-list"></ul>
      <div id="concept-list" class="concept-list hidden"></div>
    </section>

    <footer id="player-bar" class="player-bar hidden">
      <div class="player-cover" id="player-cover"></div>
      <div class="player-text">
        <div class="player-title-row">
          <div id="player-title" class="player-title">—</div>
          <a id="player-read-this-book" class="read-this-book hidden" hidden>讀這本</a>
        </div>
        <div class="player-sub">
          <div id="player-chapter" class="player-chapter">—</div>
          <button type="button" id="btn-rate" class="skip rate" aria-label="播放速度 1.0×">
            1.0×
          </button>
          <button type="button" id="btn-sleep" class="skip sleep" aria-label="睡眠計時關閉">
            睡眠
          </button>
        </div>
      </div>
      <div class="player-controls">
        <button type="button" id="btn-prev" class="icon" aria-label="回到開頭或上一段">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2.2v12H6V6zm3.2 6 8.8 6.2V5.8L9.2 12z" />
          </svg>
        </button>
        <button
          type="button"
          id="btn-play"
          class="icon play is-paused"
          aria-label="播放"
        >
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5-11-6.5z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
          </svg>
        </button>
        <button type="button" id="btn-next" class="icon" aria-label="下一章">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.8 6H18v12h-2.2V6zM6 5.8v12.4L14.8 12 6 5.8z" />
          </svg>
        </button>
      </div>
      <div class="player-time">
        <button type="button" id="btn-back30" class="skip" aria-label="倒退 30 秒">
          −30
        </button>
        <span id="player-pos">0:00</span>
        <input
          id="player-seek"
          type="range"
          min="0"
          max="1000"
          step="1"
          value="0"
          aria-label="進度"
        />
        <span id="player-dur">0:00</span>
        <button type="button" id="btn-fwd30" class="skip" aria-label="快轉 30 秒">
          +30
        </button>
      </div>
    </footer>

    <div id="book-layer" class="book-layer hidden" hidden>
      <button type="button" id="btn-close-book" class="close-book" aria-label="放回書架">
        放回
      </button>
      <div id="book-stage" class="book-stage"></div>
    </div>

    <input
      id="file-input-dir"
      type="file"
      webkitdirectory
      directory
      multiple
      hidden
    />
    <input
      id="file-input-files"
      type="file"
      accept="audio/*,image/jpeg,image/png,image/webp,.mp3,.m4a,.m4b,.aac,.epub,.jpg,.jpeg,.png,.webp"
      multiple
      hidden
    />
    <audio id="audio" preload="metadata" playsinline></audio>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="source-sheet" class="sheet hidden" hidden role="dialog" aria-modal="true" aria-labelledby="source-sheet-title">
      <div class="sheet-card">
        <h2 id="source-sheet-title">書庫來源</h2>
        <p id="source-sheet-copy" class="hint">
          用 Google 登入以載入共享的 <code>Library</code> 資料夾。
        </p>
        <ul id="source-sheet-list" class="source-list"></ul>
        <div class="cta-row cta-stack">
          <button type="button" id="btn-sheet-reload" class="primary hidden">
            重新載入書庫
          </button>
          <button type="button" id="btn-sheet-google" class="primary hidden">
            用 Google 登入
          </button>
          <button type="button" id="btn-sheet-local-link" class="text-link hidden">
            改用本機資料夾
          </button>
          <button type="button" id="btn-sheet-signout" class="ghost hidden">
            登出
          </button>
          <details id="source-sheet-advanced" class="source-advanced hidden" hidden>
            <summary>進階</summary>
            <div class="cta-row cta-stack">
              <button type="button" id="btn-sheet-local" class="ghost hidden">
                選擇 Library 資料夾
              </button>
              <button type="button" id="btn-sheet-files" class="ghost hidden">
                選擇音檔
              </button>
            </div>
          </details>
          <button type="button" id="btn-sheet-picker" class="ghost hidden" hidden>
            瀏覽 Google 雲端硬碟
          </button>
          <button type="button" id="btn-sheet-cancel" class="ghost">取消</button>
        </div>
      </div>
    </div>
    <button type="button" id="btn-sort" class="hidden" hidden title="排序書架">排序</button>
    <script type="module" src="./app.js?v=51"></script>
  </body>
</html>
